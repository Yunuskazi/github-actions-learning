name: C Program Compile and Execute

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Display repository files
        run: echo "📁 Repository Structure:" && ls -la
      
      - name: Compile C program
        run: |
          echo "🔨 Compiling C program..."
          gcc -o hello hello.c
          echo "✅ Compilation successful!"
      
      - name: Display compiled executable
        run: |
          echo "📦 Compiled files:"
          ls -la hello
      
      - name: Execute C program
        run: |
          echo "▶️ Running C program output:"
          ./hello
          echo ""
          echo "✨ Program execution completed!"
      
      - name: Show all files after execution
        run: |
          echo "📋 Final directory contents:"
          ls -la
